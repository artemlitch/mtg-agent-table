<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MTG Agent Table</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="table">
    <div id="topbar">
      <div class="setup">
        <button id="btn-newgame">New game</button>
      </div>
      <div id="turnbanner"></div>
      <div id="newgame-overlay" class="hidden">
        <div class="ngtitle">New game</div>
        <div class="ngrow">
          <label for="deck-you">Your deck</label>
          <input id="deck-you" placeholder="Archidekt URL or deck id" autocomplete="off">
          <a id="decklink-you" target="_blank" rel="noopener"></a>
        </div>
        <div class="ngrow">
          <label for="deck-agent">Agent's deck</label>
          <input id="deck-agent" placeholder="Archidekt URL or deck id" autocomplete="off">
          <a id="decklink-agent" target="_blank" rel="noopener"></a>
        </div>
        <div class="ngbtns">
          <button id="btn-loaddecks">Load decks</button>
          <button id="btn-ngcancel">Cancel</button>
        </div>
      </div>
      <div class="phasebtns">
        <button data-phase="untap/upkeep">Untap</button>
        <button data-phase="main 1">Main 1</button>
        <button data-phase="combat">Combat</button>
        <button data-phase="main 2">Main 2</button>
        <button data-phase="end">End</button>
        <button id="btn-endturn" class="accent">End turn → Agent</button>
        <button id="btn-undo" title="Undo the last action (any player)">↩ Undo</button>
      </div>
    </div>

    <div class="seat" id="seat-agent">
      <div class="rail" id="rail-agent"></div>
      <div class="boardwrap">
        <div class="handrow" id="hand-agent"></div>
        <div class="battlefield" id="bf-agent"></div>
      </div>
    </div>

    <div id="midline"></div>

    <div class="seat" id="seat-you">
      <div class="rail" id="rail-you"></div>
      <div class="boardwrap">
        <button id="btn-noblocks" class="hidden">🛡 No blocks — take the damage</button>
        <div class="battlefield" id="bf-you"></div>
        <div class="handrow" id="hand-you"></div>
        <button id="btn-token" title="Create a token"><span class="tstar">✦</span><span>Token</span></button>
      </div>
    </div>
  </div>

  <div id="side">
    <div id="tabs">
      <button data-tab="stack">Stack<span id="stack-badge" class="tabbadge hidden"></span></button>
      <button data-tab="chat" class="active">Chat</button>
      <button data-tab="brain">Agent brain</button>
      <button data-tab="log">Log</button>
    </div>
    <div class="tabpane hidden" id="pane-stack"></div>
    <div class="tabpane" id="pane-chat"></div>
    <div class="tabpane hidden" id="pane-brain"></div>
    <div class="tabpane hidden" id="pane-log"></div>
    <div id="question"></div>
    <div id="composer">
      <input id="chat-input" placeholder="Say something to the agent…">
      <button id="btn-send">Send</button>
    </div>
  </div>
</div>

<div id="menu" class="hidden"></div>
<div id="modal" class="hidden"><div id="modal-box"></div></div>
<div id="cardpreview" class="hidden"></div>

<script src="app.js"></script>
</body>
</html>
