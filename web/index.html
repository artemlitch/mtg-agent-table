<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MTG Battlefield</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="table">
    <div id="topbar">
      <div class="setup">
        <button id="btn-newgame">New game</button>
      </div>
      <div id="turnbanner"></div>
      <div id="newgame-overlay" class="hidden">
        <div class="ngtitle">New game</div>
        <div class="ngrow">
          <label for="deck-agent">Agent's deck</label>
          <input id="deck-agent" placeholder="Archidekt URL or deck id" autocomplete="off">
          <a id="decklink-agent" target="_blank" rel="noopener"></a>
        </div>
        <div class="ngrow">
          <label for="deck-you">Your deck</label>
          <input id="deck-you" placeholder="Archidekt URL or deck id" autocomplete="off">
          <a id="decklink-you" target="_blank" rel="noopener"></a>
        </div>
        <div class="ngrow">
          <label for="ng-model">Opponent</label>
          <select id="ng-model">
            <option value="opus">Opus — strongest</option>
            <option value="sonnet">Sonnet — strong</option>
            <option value="haiku">Haiku — casual</option>
          </select>
        </div>
        <div class="ngbtns">
          <button id="btn-loaddecks">Load decks</button>
          <button id="btn-ngcancel">Cancel</button>
        </div>
      </div>
      <div class="phasebtns">
        <button data-phase="untap/upkeep">Untap</button>
        <button data-phase="main 1">Main 1</button>
        <button data-phase="combat">Combat</button>
        <button data-phase="main 2">Main 2</button>
        <button data-phase="end">End</button>
        <button id="btn-endturn" class="accent">End turn → Agent</button>
        <button id="btn-undo" title="Undo the last action, any player (⌘Z)">↩ Undo</button>
      </div>
    </div>

    <div id="felt">
      <div id="combatglow"></div>

    <div class="seat" id="seat-agent">
      <div class="rail" id="rail-agent"></div>
      <div class="boardwrap">
        <div class="handrow" id="hand-agent"></div>
        <div class="battlefield" id="bf-agent"></div>
      </div>
    </div>

    <div id="midline">
      <div id="nextaction" class="hidden">
        <div class="na-row">
          <div class="na-undowrap">
            <button id="na-undo" title="Undo the last action (⌘Z)"><span>↩</span></button>
            <span class="na-key">⌘Z</span>
          </div>
          <button id="na-primary">
            <img id="na-card" class="hidden" alt="">
            <span class="na-text">
              <span class="na-label"></span>
              <span class="na-sub hidden"></span>
              <span class="na-key">space</span>
            </span>
          </button>
          <div id="na-hint" class="hidden"></div>
        </div>
        <button id="na-skip" class="hidden"><span>⏭ skip to pass turn</span><span class="na-key">⇧ + space</span></button>
      </div>
    </div>

    <div class="seat" id="seat-you">
      <div class="rail" id="rail-you"></div>
      <div class="boardwrap">
        <div class="battlefield" id="bf-you"></div>
        <div id="handzone" class="hidden"><span>↩ back to hand</span></div>
        <div class="handrow" id="hand-you"></div>
        <button id="btn-token" title="Create a token"><span class="tstar">✦</span><span>Token</span></button>
      </div>
    </div>
    </div>
  </div>

  <div id="side">
    <div id="tabs">
      <button data-tab="stack">Stack<span id="stack-badge" class="tabbadge hidden"></span></button>
      <button data-tab="chat" class="active">Chat</button>
      <button data-tab="brain">Agent</button>
      <button data-tab="log">Log</button>
    </div>
    <div id="brain-header" class="hidden">
      <span class="bh-label">Claude API key</span>
      <button id="btn-delkey">Delete key</button>
    </div>
    <div class="tabpane hidden" id="pane-stack"></div>
    <div class="tabpane" id="pane-chat"></div>
    <div class="tabpane hidden" id="pane-brain"></div>
    <div class="tabpane hidden" id="pane-log"></div>
    <div id="keysetup" class="hidden">
      <div class="keybox">
        <div class="keytitle">Bring your opponent to life</div>
        <div class="keysub">Use Claude Code — your Claude subscription, nothing per game</div>
        <div id="cli-status" class="keyhint"></div>
        <button id="btn-clitest">Test Claude Code</button>
        <div id="cli-error"></div>
        <div class="keydivider">— or —</div>
        <div class="keysub">Paste an Anthropic API key</div>
        <input id="key-input" type="password" placeholder="sk-ant-…" autocomplete="off">
        <button id="btn-savekey">Save</button>
        <div id="key-error"></div>
        <div class="keyhint">An API key bills your Anthropic Console account per token.<br>Either choice stays on this machine only.</div>
      </div>
    </div>
    <div id="question"></div>
    <div id="composer">
      <input id="chat-input" placeholder="Say something to the agent…">
      <button id="btn-send">Send</button>
    </div>
  </div>
</div>

<div id="menu" class="hidden"></div>
<div id="modal" class="hidden"><div id="modal-box"></div></div>
<div id="cardpreview" class="hidden"></div>

<script src="sfx.js"></script>
<script src="app.js"></script>
</body>
</html>
