<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deck Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles/index.css">
<link rel="stylesheet" href="/swap.css">
</head>
<body class="studio">
<header id="studio-top">
  <h1>Deck Studio</h1>
  <div class="deckpick">
    <select id="deck-select"><option value="">Loading decks…</option></select>
    <a id="deck-link" target="_blank" rel="noopener" title="Open on Archidekt">↗</a>
    <button id="btn-refresh" title="Re-read the deck from Archidekt">Refresh</button>
  </div>
  <div id="conn" class="conn" title="live connection"></div>
</header>

<div id="deckstrip" class="hidden"></div>
<div id="error" class="hidden"></div>

<main id="board">
  <div class="empty">Pick a deck above, then ask your agent for swap proposals. They appear here as it files them.</div>
</main>

<div id="cardpreview" class="hidden"></div>
<script src="/swap.js"></script>
</body>
</html>
