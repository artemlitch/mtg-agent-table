<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sound Lab — MTG Agent Table</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles/index.css">
<style>
  /* A CLASS, not a bare `body`, and the reason is load order in the BUILT page:
     Vite appends its bundled stylesheet after this block, so index.css's
     `body { overflow: hidden }` — right for a table you drag cards across —
     won on equal specificity and clipped this page at the fold with no way to
     reach the rest. It scrolled in dev and not in the app. swap.html has used
     `body.studio` from the start, which is why the studio page never had this. */
  body.lab { overflow: auto; height: auto; min-height: 100vh; padding: 20px; }
  h1 { font: 700 22px/1.4 var(--font-fantasy); color: var(--accent); letter-spacing: 0.08em; margin-bottom: 4px; }
  .hint { color: var(--dim); font-size: 12px; margin-bottom: 18px; }
  /* Save belongs to its own row, beside the Play that tells you whether it is
     worth saving. Its result reads out next to it — a save that writes a file
     in the checkout should say so where you are looking. */
  .savemsg { font-size: 11px; color: var(--dim); align-self: center; }
  .savemsg.ok { color: var(--green, #59a86c); }
  .savemsg.bad { color: var(--red, #d05555); }
  /* the row that changed since it was loaded gets its Save lit */
  .savebtn.dirty {
    background: linear-gradient(180deg, #f0d078, #b8862c) padding-box, var(--chrome) border-box;
    color: #2a1c04;
  }
  /* One row per sound, listed by name. What a row is ranked ON is the thing
     that decides whether the page holds still: the old masonry ranked by layer
     count, so adding a layer re-ranked the page and the card you were working
     on walked into another column. A name is not something editing changes, so
     sorting by it cannot move anything while you work — only adding a whole
     new sound does, and then it lands in one predictable place.

     The layers run left to right inside the row and the row scrolls, so a
     sound with six layers is as tall as a sound with one. */
  .sounds { display: flex; flex-direction: column; gap: 14px; }
  .sound {
    border: 1px solid transparent; border-radius: 12px; padding: 10px 0 12px; width: 100%;
    background: linear-gradient(var(--panel), var(--panel)) padding-box, var(--chrome-dim) border-box;
  }
  .sound .shead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 0 14px 8px; }
  .sound h2 { font: 700 14px/1.5 var(--font-fantasy); color: var(--accent); letter-spacing: 0.06em; }
  .sound .desc { color: var(--dim); font-size: 11px; flex: 1; min-width: 200px; }
  /* The scrolling strip. overflow-y is hidden and not `visible`, which next to
     an overflow-x of auto computes to auto anyway and hands the row a second,
     vertical scrollbar — one that has nothing to scroll, since the strip has
     no height of its own and grows to its tallest layer. */
  .lstrip {
    display: flex; gap: 12px; align-items: flex-start;
    overflow-x: auto; overflow-y: hidden; padding: 0 14px 4px;
    scrollbar-color: var(--line) transparent;
  }
  .lstrip:empty::after { content: "no layers — add one below"; color: var(--dim); font-size: 11px; }
  /* fixed width, so the params line up column-wise down the page and a slider
     is the same length in every row — the point of a slider here is fine
     control, so it gets the width left over after the label and the number */
  .layer {
    flex: none; width: 272px;
    border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px 6px;
  }
  .layer .lhead { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--dim); }
  .param { display: grid; grid-template-columns: 52px 1fr 58px; gap: 8px; align-items: center; margin: 3px 0; font-size: 11px; }
  .notelabel { display: block; color: var(--accent); font-size: 9px; font-weight: 700; }
  .param input[type="range"] { width: 100%; padding: 0; background: none; border: none; }
  .param input[type="number"] { width: 100%; padding: 2px 4px; font-size: 11px; }
  .param select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 5px; font-size: 11px; }
  .rowbtns { display: flex; gap: 6px; margin-top: 10px; padding: 0 14px; }
  .playbtn {
    background: linear-gradient(180deg, #f0d078, #b8862c) padding-box, var(--chrome) border-box;
    color: #2a1c04; border: 1px solid transparent;
  }
  #exportbox { width: 100%; height: 180px; margin-top: 8px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; font: 11px/1.5 ui-monospace, monospace; padding: 8px; }
  .exportwrap { margin-top: 22px; max-width: 760px; }
</style>
</head>
<body class="lab">
<h1>Sound Lab</h1>
<div class="hint">Tweak, hit Play, repeat. Each row saves itself into public/sounds.json — the file the table reads. (Click anywhere once to arm audio.)</div>
<div class="sounds" id="sounds">loading sounds.json…</div>

<script src="/sfx.js"></script>
<script>
// The engine comes from sfx.js and the sounds from sounds.json, which sfx.js
// fills this very object with — the lab edits it in place, so the table plays
// exactly what you hear here, and Save writes it back to that same file.
const SOUNDS = SFX.SOUNDS;
const play = SFX.play;

// slider ranges per layer kind — lab UI only
const PARAMS = {
  tone: [
    ["freq", 20, 4000, 1], ["slide", 0, 4000, 1], ["dur", 0.01, 1.2, 0.01],
    ["vol", 0, 0.8, 0.005], ["verb", 0, 1, 0.01], ["atk", 0.001, 0.06, 0.001], ["t", 0, 1, 0.01],
  ],
  noise: [
    ["freq", 60, 6000, 10], ["slide", 0, 6000, 10], ["q", 0.1, 8, 0.1],
    ["dur", 0.01, 1.2, 0.01], ["vol", 0, 0.8, 0.005], ["verb", 0, 1, 0.01], ["atk", 0, 0.3, 0.005], ["t", 0, 1, 0.01],
  ],
};

// Adding or removing a layer rebuilds the page, and a rebuild resets every
// strip to the left. Remembered by name, so the row you are working in is
// still looking at the layer you were looking at.
const scrollAt = {};
// which rows have been touched since they were last loaded or saved — the
// only thing that tells you, hours in, which of eleven rows you actually
// changed. Survives a rebuild, since a rebuild is itself an edit.
const dirty = new Set();

/** Write ONE sound back to public/sounds.json. Per sound rather than per
 *  file: the server re-reads the file and replaces this one key, so saving a
 *  row you have finished cannot carry along a row you are half-way through. */
async function saveSound(name, btn, msg) {
  btn.disabled = true;
  msg.className = "savemsg";
  msg.textContent = "saving…";
  try {
    const res = await fetch("/api/sounds", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ name, sound: SOUNDS[name] }),
    });
    const out = await res.json();
    if (out.ok) {
      dirty.delete(name);
      btn.classList.remove("dirty");
      msg.className = "savemsg ok";
      msg.textContent = `saved → sounds.json (${out.sounds} sounds, ${out.bytes} bytes)`;
      setTimeout(() => { if (!dirty.has(name)) msg.textContent = ""; }, 4000);
    } else {
      // the server refuses a body it cannot recognise rather than writing it,
      // and names the layer it objected to — that is the one to go and look at
      msg.className = "savemsg bad";
      msg.textContent = `not saved — ${out.error}`;
    }
  } catch (e) {
    msg.className = "savemsg bad";
    msg.textContent = `not saved — ${e.message} (is the server running?)`;
  }
  btn.disabled = false;
}

function build() {
  const root = document.getElementById("sounds");
  for (const s of root.querySelectorAll(".lstrip")) scrollAt[s.dataset.sound] = s.scrollLeft;
  root.innerHTML = "";
  const byName = Object.entries(SOUNDS).sort(([a], [b]) => a.localeCompare(b));
  for (const [name, def] of byName) {
    const card = document.createElement("div");
    card.className = "sound";
    card.innerHTML = `<div class="shead"><h2>${name}</h2><div class="desc">${def.desc}</div></div>`;
    const strip = document.createElement("div");
    strip.className = "lstrip";
    strip.dataset.sound = name;
    card.appendChild(strip);
    // any edit anywhere in this row lights its Save. Called from the handlers
    // rather than inferred by diffing: the row is what got edited, and the row
    // is what gets saved.
    const touched = () => {
      dirty.add(name);
      card.querySelector(".savebtn")?.classList.add("dirty");
    };
    def.layers.forEach((layer, li) => {
      const ld = document.createElement("div");
      ld.className = "layer";
      const head = document.createElement("div");
      head.className = "lhead";
      head.innerHTML = `<span>layer ${li + 1} — ${layer.kind}</span>`;
      const rm = document.createElement("button");
      rm.textContent = "✕";
      rm.onclick = () => { def.layers.splice(li, 1); dirty.add(name); build(); };
      head.appendChild(rm);
      ld.appendChild(head);
      // the picked-from-a-list params: a tone's waveform, and — on both kinds —
      // the amplitude shape, which is what decides whether a slide UP can be
      // heard as one. Everything defaults to "decay", which is what every sound
      // here has always done.
      const chooser = (label, values, get, set, tip) => {
        const row = document.createElement("div");
        row.className = "param";
        row.innerHTML = `<span>${label}</span><span></span>`;
        const sel = document.createElement("select");
        if (tip) sel.title = tip;
        for (const v of values) {
          const o = document.createElement("option");
          o.value = v; o.textContent = v;
          if (get() === v) o.selected = true;
          sel.appendChild(o);
        }
        sel.onchange = () => { set(sel.value); touched(); play(name); };
        row.appendChild(sel);
        ld.appendChild(row);
      };
      if (layer.kind === "tone") {
        chooser("wave", ["sine", "triangle", "square", "sawtooth"], () => layer.type, (v) => (layer.type = v));
      }
      chooser(
        "shape",
        SFX.SHAPES,
        () => layer.shape ?? "decay",
        // "decay" is the default, so it is not worth a field in the export
        (v) => (v === "decay" ? delete layer.shape : (layer.shape = v)),
        "decay: loudest at the start · hold: steady · swell: loudest at the end — use swell to hear a slide going UP"
      );
      for (const [p, min, max, step] of PARAMS[layer.kind]) {
        const row = document.createElement("div");
        row.className = "param";
        // frequencies get a LOGARITHMIC slider — equal travel per octave, so
        // octave 1 is as reachable as octave 7 (linear buried 30-200Hz in the
        // first few pixels). slide keeps position 0 = "off".
        const isLog = p === "freq" || p === "slide";
        const logMin = Math.max(20, min);
        const toSlider = (v) =>
          !isLog ? v : v < logMin ? 0 : Math.round(1000 * (Math.log(v / logMin) / Math.log(max / logMin)));
        const fromSlider = (s) =>
          !isLog ? Number(s) : Number(s) === 0 && min === 0 ? 0 : Math.round(logMin * Math.pow(max / logMin, Number(s) / 1000));
        const slider = document.createElement("input");
        slider.type = "range";
        slider.min = isLog ? 0 : min;
        slider.max = isLog ? 1000 : max;
        slider.step = isLog ? 1 : step;
        slider.value = toSlider(layer[p] ?? 0);
        const num = document.createElement("input");
        num.type = "number"; num.min = min; num.max = max; num.step = step; num.value = layer[p] ?? 0;
        // live musical-note readout on frequency params (E2 = 82Hz etc.)
        const NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const noteOf = (hz) => {
          if (!hz || hz < 16) return "";
          const n = Math.round(12 * Math.log2(hz / 440)) + 57; // A4=440 → index 57
          return NOTES[((n % 12) + 12) % 12] + Math.floor(n / 12);
        };
        let noteEl = null;
        if (isLog) {
          noteEl = document.createElement("span");
          noteEl.className = "notelabel";
          noteEl.textContent = noteOf(layer[p]);
        }
        const sync = (v) => {
          layer[p] = Number(v);
          slider.value = toSlider(Number(v));
          num.value = v;
          if (noteEl) noteEl.textContent = noteOf(Number(v));
          touched();
        };
        slider.oninput = () => { sync(fromSlider(slider.value)); };
        slider.onchange = () => play(name);
        num.onchange = () => { sync(num.value); play(name); };
        row.innerHTML = `<span>${p}${noteEl ? "" : ""}</span>`;
        if (noteEl) row.firstChild.appendChild(noteEl);
        row.appendChild(slider);
        row.appendChild(num);
        ld.appendChild(row);
      }
      strip.appendChild(ld);
    });
    const btns = document.createElement("div");
    btns.className = "rowbtns";
    const playB = document.createElement("button");
    playB.className = "playbtn";
    playB.textContent = "▶ Play";
    playB.onclick = () => play(name);
    // a new layer goes on the right-hand end, so the strip is asked to end up
    // there — Infinity is clamped to the far edge, whatever the new width is
    const addLayer = (layer) => { def.layers.push(layer); dirty.add(name); scrollAt[name] = Infinity; build(); };
    const addT = document.createElement("button");
    addT.textContent = "+ tone";
    addT.onclick = () => addLayer({ kind: "tone", freq: 800, dur: 0.15, vol: 0.1, t: 0, type: "sine", slide: 0 });
    const addN = document.createElement("button");
    addN.textContent = "+ noise";
    addN.onclick = () => addLayer({ kind: "noise", freq: 1000, dur: 0.1, vol: 0.15, t: 0, q: 1, slide: 0 });
    const copy = document.createElement("button");
    copy.textContent = "⧉ Copy";
    copy.title = "Copy this sound's layers to the clipboard";
    copy.onclick = async () => {
      const json = `${name}: ${JSON.stringify(def.layers, null, 1)}`;
      try {
        await navigator.clipboard.writeText(json);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = json;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
      copy.textContent = "✓ Copied";
      setTimeout(() => (copy.textContent = "⧉ Copy"), 1200);
    };
    const saveB = document.createElement("button");
    saveB.className = "savebtn" + (dirty.has(name) ? " dirty" : "");
    saveB.textContent = "💾 Save";
    saveB.title = `Write ${name} into public/sounds.json`;
    const saveM = document.createElement("span");
    saveM.className = "savemsg";
    saveB.onclick = () => saveSound(name, saveB, saveM);
    btns.append(playB, addT, addN, copy, saveB, saveM);
    card.appendChild(btns);
    root.appendChild(card);
    // a new layer is appended to the right, so land the strip on it rather
    // than leaving it just off the edge
    strip.scrollLeft = scrollAt[name] ?? 0;
  }
}

// nothing to draw until sounds.json has landed
SFX.ready.then(build);
</script>
</body>
</html>
