<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="mat" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#2b1b0e"/>
      <stop offset="70%" stop-color="#160e07"/>
      <stop offset="100%" stop-color="#0b0704"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a350f"/>
      <stop offset="30%" stop-color="#d8a03d"/>
      <stop offset="50%" stop-color="#f8e7a0"/>
      <stop offset="70%" stop-color="#d8a03d"/>
      <stop offset="100%" stop-color="#4a350f"/>
    </linearGradient>
    <linearGradient id="cardface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241708"/>
      <stop offset="100%" stop-color="#120b04"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- plate -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#mat)"/>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" filter="url(#grain)" fill="#ffffff"/>
  </g>
  <rect x="112" y="112" width="800" height="800" rx="176" fill="none" stroke="url(#rim)" stroke-width="14"/>
  <rect x="134" y="134" width="756" height="756" rx="160" fill="none" stroke="#6e5322" stroke-width="4" opacity="0.7"/>

  <!-- fanned cards -->
  <g transform="translate(512 552)">
    <g transform="rotate(-16) translate(-46 0)">
      <rect x="-140" y="-200" width="280" height="400" rx="26" fill="url(#cardface)" stroke="#8a6a28" stroke-width="10"/>
    </g>
    <g transform="rotate(16) translate(46 0)">
      <rect x="-140" y="-200" width="280" height="400" rx="26" fill="url(#cardface)" stroke="#8a6a28" stroke-width="10"/>
    </g>
    <g>
      <rect x="-140" y="-200" width="280" height="400" rx="26" fill="url(#cardface)" stroke="url(#rim)" stroke-width="12"/>
      <rect x="-116" y="-176" width="232" height="352" rx="16" fill="none" stroke="#6e5322" stroke-width="4" opacity="0.8"/>
      <!-- five-point star -->
      <path d="M 0,-118 L 27.7,-38.1 L 112.2,-36.5 L 44.9,14.6 L 69.4,95.5 L 0,47.2 L -69.4,95.5 L -44.9,14.6 L -112.2,-36.5 L -27.7,-38.1 Z"
            fill="none" stroke="#e2b355" stroke-width="11" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="16" fill="#f8e7a0"/>
    </g>
  </g>
</svg>
