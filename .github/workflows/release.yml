# Builds the desktop app for macOS and Windows and attaches both to a GitHub
# Release.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Both targets could be built on one runner — bun cross-compiles the server,
# and electron-builder writes Windows icon and version resources itself — but
# each is built on its own OS anyway, because that is the machine it will run
# on and the cross-build is one fewer thing to have been wrong about.
#
# The artifacts are not in git: the installer is ~104MB and the mac zip ~118MB,
# against a 100MB per-file limit on anything pushed. Release assets have no
# such limit, and their download URL is stable:
#
#   https://github.com/artemlitch/mtg-agent-table/releases/latest/download/MTG-Battlefield-mac-arm64.zip
#   https://github.com/artemlitch/mtg-agent-table/releases/latest/download/MTG-Battlefield-win-x64-Setup.exe
name: release

on:
  push:
    tags: ["v*"]
  # build the apps without cutting a release — they land as run artifacts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac-arm64
            asset: MTG-Battlefield-mac-arm64.zip
          - os: windows-latest
            target: win-x64
            asset: MTG-Battlefield-win-x64-Setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # bun runs the whole build: it compiles the server, and it is what
      # electron-builder itself runs under (see the note in build.mjs)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install (table)
        run: bun install --frozen-lockfile
      - name: Install (shell)
        run: npm ci
        working-directory: electron

      - name: Build
        run: bun electron/build.mjs --target=${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: electron/dist/${{ matrix.asset }}
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: electron/dist/${{ matrix.asset }}
          # neither build is signed, and each OS objects in its own way — say
          # so where people will read it rather than in a file they must open
          body: |
            Download the one for your machine below.

            **Windows** — run `MTG-Battlefield-win-x64-Setup.exe`. It installs for
            your user only, so there is no admin prompt, and adds a desktop and
            Start Menu shortcut. SmartScreen will warn about an unknown publisher:
            More info → Run anyway.

            **macOS (Apple silicon)** — unzip, drag `MTG Battlefield.app` to
            Applications, then once, because the download is quarantined:

            ```
            xattr -dr com.apple.quarantine "/Applications/MTG Battlefield.app"
            ```

            Nothing else needs installing — the server is compiled into the app.
            To have Claude play the other seat you also want the `claude` CLI
            logged in; otherwise paste a DeepSeek key into the Chat tab on first
            run.
